name: Checks
on:
  push:
    branches: ['main', 'master']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      # The runner includes Chrome's system libraries; --install-deps requires root.
      - name: Install Chrome for browser tests
        run: npx puppeteer browsers install chrome
      - run: npm run check
