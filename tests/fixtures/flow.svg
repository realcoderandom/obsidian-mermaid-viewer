<svg id="example-flow" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 1113.015625px;" viewBox="4 3.9999923706054688 1113.015625 219.11151123046875" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#example-flow{font-family:Arial;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#example-flow .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#example-flow .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#example-flow .error-icon{fill:#552222;}#example-flow .error-text{fill:#552222;stroke:#552222;}#example-flow .edge-thickness-normal{stroke-width:1px;}#example-flow .edge-thickness-thick{stroke-width:3.5px;}#example-flow .edge-pattern-solid{stroke-dasharray:0;}#example-flow .edge-thickness-invisible{stroke-width:0;fill:none;}#example-flow .edge-pattern-dashed{stroke-dasharray:3;}#example-flow .edge-pattern-dotted{stroke-dasharray:2;}#example-flow .marker{fill:#333333;stroke:#333333;}#example-flow .marker.cross{stroke:#333333;}#example-flow svg{font-family:Arial;font-size:16px;}#example-flow p{margin:0;}#example-flow .label{font-family:Arial;color:#333;}#example-flow .cluster-label text{fill:#333;}#example-flow .cluster-label span{color:#333;}#example-flow .cluster-label span p{background-color:transparent;}#example-flow .label text,#example-flow span{fill:#333;color:#333;}#example-flow .node rect,#example-flow .node circle,#example-flow .node ellipse,#example-flow .node polygon,#example-flow .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#example-flow .rough-node .label text,#example-flow .node .label text,#example-flow .image-shape .label,#example-flow .icon-shape .label{text-anchor:middle;}#example-flow .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#example-flow .rough-node .label,#example-flow .node .label,#example-flow .image-shape .label,#example-flow .icon-shape .label{text-align:center;}#example-flow .node.clickable{cursor:pointer;}#example-flow .root .anchor path{fill:#333333!important;stroke-width:0;stroke:#333333;}#example-flow .arrowheadPath{fill:#333333;}#example-flow .edgePaths .path{stroke:#333333;stroke-width:1px;}#example-flow .flowchart-link{stroke:#333333;fill:none;}#example-flow .edgeLabel{background-color:rgba(232,232,232, 0.8);text-align:center;}#example-flow .edgeLabel p{background-color:rgba(232,232,232, 0.8);}#example-flow .edgeLabel rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#example-flow .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#example-flow .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#example-flow .cluster text{fill:#333;}#example-flow .cluster span{color:#333;}#example-flow .node .collapsed-indicator{fill:#aaaa33;stroke:none;opacity:0.6;}#example-flow .node .collapsed-separator{stroke:#aaaa33;stroke-width:0.75px;}#example-flow div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Arial;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#example-flow .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#example-flow rect.text{fill:none;stroke-width:0;}#example-flow .icon-shape,#example-flow .image-shape{background-color:rgba(232,232,232, 0.8);text-align:center;}#example-flow .icon-shape p,#example-flow .image-shape p{background-color:rgba(232,232,232, 0.8);padding:2px;}#example-flow .icon-shape .label rect,#example-flow .image-shape .label rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#example-flow .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#example-flow .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#example-flow .node .neo-node{stroke:#9370DB;}#example-flow [data-look="neo"].node rect,#example-flow [data-look="neo"].cluster rect,#example-flow [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#example-flow [data-look="neo"].swimlane.cluster rect{filter:none;}#example-flow [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#example-flow [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#example-flow [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#example-flow [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#example-flow [data-look="neo"].node circle .state-start{fill:#000000;}#example-flow [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#example-flow [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#example-flow :root{--mermaid-font-family:Arial;}</style><g><marker id="example-flow_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id="example-flow_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id="example-flow_flowchart-v2-pointEnd-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto"><path d="M 0 0 L 11.5 7 L 0 14 z" class="arrowMarkerPath" style="stro